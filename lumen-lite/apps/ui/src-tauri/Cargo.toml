[package]
name = "lumen-lite"
version = "1.0.0"
description = "LumenLite - Projecao Liturgica de Alta Performance"
authors = ["LumenLite Team"]
edition = "2021"

[lib]
name = "lumen_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
